    <animate attributeName="opacity" values="0.22;0.34;0.22" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="100" r="110" fill="#b91c1c" opacity="0.22" filter="url(#blurMed)">
    <animate attributeName="opacity" values="0.34;0.22;0.34" dur="8s" repeatCount="indefinite"/>
  </circle>
  <g font-family="Georgia, serif" font-size="52" fill="#e0483e" text-anchor="middle">
