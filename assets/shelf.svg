    <text x="995" y="105">24</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="13" fill="#9a8f85" text-anchor="middle">
    <text x="205" y="140">MUSICNEST STARS</text>
    <text x="500" y="140">PUBLIC REPOS</text>
    <text x="700" y="140">LATEST RELEASE</text>
    <text x="995" y="140">REELS POSTED</text>
  </g>
  <g stroke="#4a2020" stroke-width="1">
    <line x1="352" y1="55" x2="352" y2="145"/>
