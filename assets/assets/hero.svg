<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blurMed" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="1200" height="460" fill="#0d0a0a"/>
  <!-- red glow atmosphere -->
  <circle cx="980" cy="90" r="190" fill="#b91c1c" opacity="0.32" filter="url(#blurBig)">
    <animate attributeName="opacity" values="0.32;0.5;0.32" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="400" r="160" fill="#7f1d1d" opacity="0.30" filter="url(#blurBig)">
    <animate attributeName="opacity" values="0.30;0.45;0.30" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="230" r="120" fill="#e0483e" opacity="0.10" filter="url(#blurBig)">
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="11s" repeatCount="indefinite"/>
  </circle>
  <!-- panel -->
  <rect x="24" y="24" width="1152" height="412" fill="#140d0d" opacity="0.82" stroke="#4a2020" stroke-width="2"/>
  <!-- drifting particles -->
  <g fill="#e0483e">
    <circle cx="180" cy="360" r="3" opacity="0.5"><animate attributeName="cy" values="360;330;360" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="2.5" opacity="0.4"><animate attributeName="cy" values="120;95;120" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="330" r="3" opacity="0.45"><animate attributeName="cy" values="330;300;330" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="70" r="2" opacity="0.35"><animate attributeName="cy" values="70;50;70" dur="12s" repeatCount="indefinite"/></circle>
  </g>
  <!-- terminal line with reveal + blinking cursor -->
  <text x="72" y="90" font-family="'Courier New', monospace" font-size="20" fill="#e0483e">~/swapnendu $ build --ship</text>
  <rect x="392" y="72" width="11" height="22" fill="#e0483e">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="134" font-family="'Courier New', monospace" font-size="16" letter-spacing="3" fill="#9a8f85">APPS · BOTS · MUSIC TECHNOLOGY</text>
  <text x="72" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#ece5d8">Swapnendu Mal</text>
  <text x="552" y="220" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#e0483e">.</text>
  <text x="72" y="268" font-family="'Courier New', monospace" font-size="16" letter-spacing="2" fill="#ece5d8">APP DEVELOPER · BOT BUILDER · INDIE MAKER</text>
  <text x="72" y="308" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#d98e4a">Ship products people actually use.</text>
  <text x="72" y="392" font-family="'Courier New', monospace" font-size="15" fill="#9a8f85">TAMLUK · WEST BENGAL · INDIA   |   MUSICNEST.ME   |   11 PUBLIC REPOS</text>
  <text x="1128" y="90" text-anchor="end" font-family="'Courier New', monospace" font-size="15" fill="#9a8f85">VER 2.0</text>
  <!-- monogram with rotating dashed ring -->
  <circle cx="1000" cy="245" r="85" fill="none" stroke="#4a2020" stroke-width="2"/>
  <circle cx="1000" cy="245" r="98" fill="none" stroke="#e0483e" stroke-width="2" stroke-dasharray="14 20" opacity="0.65">
    <animateTransform attributeName="transform" type="rotate" from="0 1000 245" to="360 1000 245" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="245" r="60" fill="#e0483e" opacity="0.12" filter="url(#blurMed)">
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="1000" y="258" text-anchor="middle" font-family="Georgia, serif" font-size="64" fill="#e0483e">SM</text>
  <text x="920" y="140" font-family="'Courier New', monospace" font-size="13" fill="#9a8f85">+ APPS</text>
  <text x="1060" y="360" font-family="'Courier New', monospace" font-size="13" fill="#9a8f85">+ BOTS</text>
</svg>
